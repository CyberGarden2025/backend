services:
  backend:
    build:
        context: .
        dockerfile: ./docker/Dockerfile
    container_name: backend-service
    env_file: .env
    depends_on:
        - postgres
    logging:
        driver: json-file
        options:
            max-size: 50m
            max-file: 3
    restart: unless-stopped
    ports:
        - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    # networks:
    #     - backend
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: pg
    env_file: .env
    # ports:
    #   - 5432:5432
    environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_NAME}
    volumes:
        - postgres_data:/var/lib/postgresql/data
    # networks:
    #   - backend


# # NETWORKS
# networks:
#     backend:
#         driver: bridge

# VOLUMES
volumes:
    postgres_data:
