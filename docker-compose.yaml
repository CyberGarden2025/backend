services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    container_name: pg
    env_file: .env
    ports:
      - 5432:5432
    environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_NAME}
    volumes:
        - postgres_data:/var/lib/postgresql/data
    networks:
      - backend


# NETWORKS
networks:
    backend:
        driver: bridge

# VOLUMES
volumes:
    postgres_data:
